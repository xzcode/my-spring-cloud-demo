# Nacos 共享配置 - MongoDB
# 请按环境分别配置到对应的 Nacos Namespace 中
# 详见 docs/nacos-config/dev|test|prod/ 目录下的配置文件
# Data ID: shared-mongo.yml  Group: DEFAULT_GROUP
# 注意：每个服务通过各自 application.yml 中的 spring.data.mongodb.database 指定独立数据库

spring:
  data:
    mongodb:
      host: localhost
      port: 27017

app:
  mongo:
    secondary:
      enabled: false
    reactive:
      enabled: false
